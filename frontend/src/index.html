<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FF Level — Free Fire auto level-up</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="FF Level levels up your Free Fire account 24/7 in the cloud. Private dashboard, live EXP tracking, multiple accounts, instant activation.">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffcf5c'/%3E%3Cstop offset='.55' stop-color='%23ff6a1a'/%3E%3Cstop offset='1' stop-color='%23ff3d2e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath fill='none' stroke='%231c0800' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round' d='M26 37.5a5 5 0 0 0 5-5c0-2.8-1-4-2-6-2.1-4.3-.4-8.1 4-12 1 5 4 9.8 8 13 4 3.2 6 7 6 11a14 14 0 1 1-28 0c0-2.3.9-4.6 2-6a5 5 0 0 0 5 5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint (no light/dark flash).
    (function () {
      var m = 'system';
      try { m = localStorage.getItem('ff-theme') || 'system'; } catch (e) {}
      var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>

</body>
